#WACE configuration file - trivial2 (attack=1.0) in training mode
# Used to verify training models are excluded from the decision plugin.
# trivial2 would cause a block in sync mode (see TestBlockTransactions),
# but must not affect the decision when in training mode.

logpath: "/dev/null"
loglevel: "DEBUG"

modelplugins:
  - id: "trivial"
    plugintype: RequestHeaders
    path: "testdata/plugins/trivial.so"
    weight: 0
  - id: "trivial2"
    plugintype: RequestHeaders
    path: "testdata/plugins/trivial2.so"
    weight: 1
    training: true
    training_data:
      max_samples: 10
      result_file_path: "/tmp/training_results.json"

decisionplugins:
  - id: "weighted_sum"
    path: "testdata/plugins/weighted_sum.so"
    params:
      waf_weight: "0.5"
      threshold: "0.1"

options:
  crs_version: "4.4.0-dev"
  early_blocking: "true"

ruleidsforexceptions:
  RequestHeaders: 100
  RequestBody: 200
  AllRequest: 300
  ResponseHeaders: 400
  ResponseBody: 500
  AllResponse: 600
