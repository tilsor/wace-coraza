#WACE configuration file - invalid: training + remote combination

logpath: "/dev/null"
loglevel: "WARN"

model_plugins:
  - id: "trivial_training"
    plugin_type: RequestHeaders
    path: "testdata/plugins/trivial.so"
    training: true
    remote: true
    training_data:
      max_samples: 10
      result_file_path: "/tmp/training_results.json"

decision_plugins:
  - id: "weighted_sum"
    path: "testdata/plugins/weighted_sum.so"
    waf_weight: 0.5
    params:
      threshold: "0.5"

crs_version: "4.4.0-dev"

exception_ids:
  RequestHeaders: 100
