#WACE configuration file - valid training model

logpath: "/dev/null"
loglevel: "DEBUG"

modelplugins:
  - id: "trivial_training"
    plugintype: RequestHeaders
    path: "testdata/plugins/trivial.so"
    weight: 0.25
    training: true
    training_data:
      max_samples: 10
      result_file_path: "/tmp/training_results.ndjson"

decisionplugins:
  - id: "weighted_sum"
    path: "testdata/plugins/weighted_sum.so"
    params:
      waf_weight: "0.5"
      threshold: "0.5"

crs_version: "4.4.0-dev"

exception_ids:
  RequestHeaders: 100
  RequestBody: 200
  AllRequest: 300
  ResponseHeaders: 400
  ResponseBody: 500
  AllResponse: 600
