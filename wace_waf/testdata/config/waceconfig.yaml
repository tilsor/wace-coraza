#WACE configuration file

# WACE general configuration
#The full path to the wace log file
logpath: "/dev/null"
#The level of debug, the valid options are - ERRO, WARN, INFO, DEBUG
loglevel: "WARN"

#The model plugins configuration
modelplugins:
  - id: "trivial"
    plugintype: RequestHeaders
    path: "testdata/plugins/trivial.so"
    weight: 0.25
    mode: sync
  - id: "trivial2"
    plugintype: RequestBody
    path: "testdata/plugins/trivial2.so"
    weight: 0.25
    mode: sync

decisionplugins:
  - id: "weighted_sum"
    path: "testdata/plugins/weighted_sum.so"
    params:
      waf_weight: "0.5"
      threshold: "0.5"

otel_url: "localhost:4317"
crs_version: "4.4.0-dev"
early_blocking: false

exception_ids:
  RequestHeaders: 100
  RequestBody: 200
  AllRequest: 300
  ResponseHeaders: 400
  ResponseBody: 500
  AllResponse: 600
